# the justfile's `mise env --paths`, which mise "adds" in 2026.10.11
# (https://github.com/jdx/mise/releases/tag/v2026.10.11)
min_version = "2026.10.11"

# The tools the gate and the local loop run, each at its newest release. A CI
# job's MISE_ENABLE_TOOLS names its own: "Allowlist of configured tools mise
# uses; other tools are ignored" (https://mise.jdx.dev/configuration/settings.html).
[tools]
just = "latest"
actionlint = "latest"
# "actionlint checks if `shellcheck` command exists in your system and uses it
# when it is found" (https://github.com/rhysd/actionlint/blob/main/docs/checks.md)
shellcheck = "latest"
zizmor = "latest"
yq = "latest"
"github:taiki-e/cargo-hack" = "latest"
"aqua:taiki-e/cargo-llvm-cov" = "latest"
# mise's cargo backend installs "from cargo-binstall's prebuilt binaries when
# cargo-binstall is installed" (https://mise.jdx.dev/dev-tools/backends/cargo.html),
# not by compiling
cargo-binstall = "latest"
# tool-exact, as api/pixtuoid-lofi.txt is, since the listing is this tool's
# output (opinion); bumped by hand with API_NIGHTLY, since no bot reads
# mise.toml
"cargo:cargo-public-api" = "0.52.0"
# compiles the judge's locks, and installs SKILL.md's judge venv
uv = "latest"
# runs lofi_bench's wasm build (examples/lofi_bench.mjs)
node = "latest"

[settings]
# the cooldown dependabot.yml gives the actions and the locks, for `latest` too
minimum_release_age = "7d"

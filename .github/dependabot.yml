version: 2
updates:
  # rust-toolchain.toml's exact pin: each release lands as its own PR.
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  # The judge's two `uv pip compile` locks, which the uv ecosystem recompiles
  # with the flags each one's header names (dependabot-core's
  # uv/lib/dependabot/uv/file_updater/compile_file_updater.rb).
  - package-ecosystem: uv
    directory: /.claude/skills/procedural-lofi/judge
    schedule:
      interval: weekly
    groups:
      judge:
        patterns: ["*"]
    open-pull-requests-limit: 5
    # The bumps the judge's own dependencies forbid, which would only turn the
    # update job red with "No solution found" every week. Lift each when the
    # bound holding it lifts.
    ignore:
      # laion-clap 1.1.7 and fadtk 1.1.0, both their newest, require numpy<2
      # (https://pypi.org/pypi/laion-clap/1.1.7/json and
      # https://pypi.org/pypi/fadtk/1.1.0/json, `requires_dist`)
      - dependency-name: numpy
        update-types: ["version-update:semver-major"]
      # scipy 1.18 requires numpy>=2 (https://pypi.org/pypi/scipy/1.18.1/json)
      - dependency-name: scipy
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # fadtk 1.1.0 requires transformers<5 (https://pypi.org/pypi/fadtk/1.1.0/json)
      - dependency-name: transformers
        update-types: ["version-update:semver-major"]
      # transformers 4.57.6 requires huggingface-hub<1.0
      # (https://pypi.org/pypi/transformers/4.57.6/json)
      - dependency-name: huggingface-hub
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7

# yaml-language-server: $schema=https://json.schemastore.org/zizmor.json

rules:
  unpinned-uses:
    config:
      # Every other action is hash-pinned, zizmor's default: "a tag can be
      # moved or deleted if a bad actor gains access to the repository storing
      # the action" (GitHub's secure-use reference).
      policies:
        # The org's shared workflows and actions run at `@main`, which changes
        # only through a PR (https://github.com/pixtuoid/.github/rules/24918053).
        pixtuoid/.github/*: ref-pin

name: 'Setup Tools'
description: 'Installs the given mise.toml tools, and only those, through mise'

inputs:
  tools:
    description: 'Comma-separated mise.toml [tools] keys'
    required: true

runs:
  using: 'composite'
  steps:
    # the job's later steps too: mise "uses" only these (mise's `enable_tools`)
    - shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
      run: echo "MISE_ENABLE_TOOLS=$TOOLS" >>"$GITHUB_ENV" # zizmor: ignore[github-env] the callers' `tools:` literals, never event data
    - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      with:
        # opinion: `latest` resolves every run, so a cache saves little and
        # could hand back an older match
        cache: false

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  # a main push in its own group, never cancelled: in a shared one, "any
  # existing pending job or workflow in the same concurrency group will be
  # canceled" (https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency),
  # so back-to-back merges would cancel each other's ci-gate and coverage upload
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      MISE_ENABLE_TOOLS: just,cargo-binstall,cargo:cargo-public-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pixtuoid/.github/.github/actions/setup-rust@main
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          # opinion: `latest` resolves every run, so a cache saves little and
          # could hand back an older match
          cache: false
      - run: just preflight
      - run: cargo package --locked
      # cargo 1.99.1's verify build passed a package whose example doesn't
      # compile (observed; cargo-package's docs name no target), so this is
      # what catches a shipped one, or its tests, missing the files they include
      - name: the packaged examples and their tests build
        run: |
          set -euo pipefail
          version=$(cargo metadata --format-version 1 --no-deps --locked | jq -r '.packages[0].version')
          manifest="target/package/pixtuoid-lofi-$version/Cargo.toml"
          cargo build --locked --examples --manifest-path "$manifest"
          cargo test --locked --examples --no-run --manifest-path "$manifest"
      - name: no dependency, as Cargo.toml's description promises
        run: test "$(cargo metadata --format-version 1 --no-deps --locked | jq '.packages[0].dependencies | length')" = 0
      # .gitignore is the one list of audio extensions; `-c -i` lists "only
      # those files matching an exclude pattern" (git-ls-files), any case
      - name: no audio file is ever committed
        run: |
          set -euo pipefail
          if git -c core.ignorecase=true ls-files -ci --exclude-standard | grep .; then
            echo "::error::files .gitignore ignores are tracked; references are copyrighted and takes are local"
            exit 1
          fi
      - name: ab_judge.py's verdict gate holds its tests
        run: python3 -I .claude/skills/procedural-lofi/scripts/test_verdict.py
      - name: the remote judge's batch validator holds its tests
        run: python3 -I .claude/skills/procedural-lofi/judge/test_validate_batch.py
      - name: the remote judge's local logic holds its tests
        run: python3 -I .claude/skills/procedural-lofi/judge/test_judge_local.py

  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      MISE_ENABLE_TOOLS: just
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pixtuoid/.github/.github/actions/setup-rust@main
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          # opinion: `latest` resolves every run, so a cache saves little and
          # could hand back an older match
          cache: false
      - run: just test

  # so a toolchain bump can't raise the real floor under the declared one
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      MISE_ENABLE_TOOLS: just,github:taiki-e/cargo-hack
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          # opinion: `latest` resolves every run, so a cache saves little and
          # could hand back an older match
          cache: false
      - run: just msrv

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      MISE_ENABLE_TOOLS: just
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pixtuoid/.github/.github/actions/setup-rust@main
        with:
          targets: wasm32-unknown-unknown
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          # opinion: `latest` resolves every run, so a cache saves little and
          # could hand back an older match
          cache: false
      - run: just wasm

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      MISE_ENABLE_TOOLS: just,zizmor,actionlint,shellcheck,yq
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          # opinion: `latest` resolves every run, so a cache saves little and
          # could hand back an older match
          cache: false
      - run: just workflows
        env:
          GH_TOKEN: ${{ github.token }}

  # Advisory, so not in ci-gate: `test` already gates the same suite.
  coverage:
    runs-on: ubuntu-latest
    # twice the slowest run, which the commit that set it records
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      MISE_ENABLE_TOOLS: aqua:taiki-e/cargo-llvm-cov
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pixtuoid/.github/.github/actions/setup-rust@main
        with:
          components: llvm-tools-preview
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          # opinion: `latest` resolves every run, so a cache saves little and
          # could hand back an older match
          cache: false
      - run: cargo llvm-cov --all-targets --codecov --output-path codecov.json
      - uses: pixtuoid/.github/.github/actions/upload-codecov@main
        with:
          file: codecov.json
          flag: unit

  # The one CI check the ruleset requires, so a job change needs no ruleset edit.
  # `always()`, not `!cancelled()`: "A job that is skipped will report its status as
  # 'Success'" (docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-jobs-with-conditions).
  ci-gate:
    if: ${{ always() }}
    needs: [lint, test, msrv, wasm, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: pixtuoid/.github/.github/actions/require-jobs@main
        with:
          results: ${{ toJSON(needs) }}
          label: ci-gate

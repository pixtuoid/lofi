name: release-plz

# Two triggers. `release-pr` is dispatched BY HAND, never on push:
# release-plz refreshes an open release PR on every main push, and a PR that
# carries non-bot commits is closed and re-opened fresh, so a bump a human
# raised on it would be orphaned by the next Dependabot merge. `release` runs
# only on a push to main that merges a release PR.
#
# RENAMING THIS FILE BREAKS PUBLISHING: the crates.io Trusted Publisher record
# is keyed on the workflow filename (and the `release` environment), so the
# OIDC claim stops matching until the record is updated.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

# Push runs go one at a time, in order: a push merged while a release waits
# for its environment's approval would otherwise check the tag before that
# release creates it. Under `queue: max` a pending run is kept, not cancelled
# (https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency).
concurrency:
  group: release-plz-${{ github.event_name }}
  queue: max
  cancel-in-progress: false

jobs:
  release-pr:
    name: release PR
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository_id == '1414749270'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pixtuoid/.github/.github/actions/setup-rust@main
      - id: release-plz
        uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      # release-plz/action exits green with `prs` empty (its action.yml at
      # v0.5.147), which it is "If release-plz didn't open or update a release
      # PR" (https://release-plz.dev/docs/usage/release-pr#json-output), and the
      # owner who dispatched it is owed an answer either way.
      - name: A release PR must have been opened
        env:
          PR: ${{ steps.release-plz.outputs.pr }}
          PRS_CREATED: ${{ steps.release-plz.outputs.prs_created }}
        run: |
          set -euo pipefail
          if [ "$PRS_CREATED" != "true" ]; then
            echo "::error::release-plz opened or updated no release PR: its log above says why"
            exit 1
          fi
          echo "::notice::release PR: $(jq -r .html_url <<<"$PR")"

  # release-plz's own test with `release_always = false`: the pushed commit's
  # associated PRs include one whose head branch carries `pr_branch_prefix`
  # (release_plz_core command/release.rs `should_release`). Every other push
  # is a no-op for `release`, so nothing after this holds a runner for it.
  release-merge:
    name: is this push a merged release PR
    if: github.event_name == 'push' && github.repository_id == '1414749270'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.detect.outputs.release }}
    steps:
      - name: Detect a merged release PR; refuse a stale one
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH_PREFIX: release-plz- # release-plz's default pr_branch_prefix
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head="$(gh api "repos/$REPOSITORY/commits/$SHA/pulls" \
            --jq "[.[] | select(.head.ref | startswith(\"$PR_BRANCH_PREFIX\")) | .head.sha][0] // \"\"")"
          release=false
          if [[ -n "$head" ]]; then
            # Its CHANGELOG and semver verdict cover only the main release-plz
            # wrote its commit on, so that commit must sit on the merge's
            # parent unrewritten: createCommitOnBranch stamps both its dates
            # at once, and a rebase moves the committer date alone.
            parent="$(gh api "repos/$REPOSITORY/commits/$SHA" --jq '.parents[0].sha')"
            stale="$(gh api "repos/$REPOSITORY/compare/$parent...$head" \
              --jq ".commits[0] | .parents[0].sha != \"$parent\" or .commit.author.date != .commit.committer.date")"
            if [[ "$stale" != false ]]; then
              echo "::error::the release PR merged at ${SHA::7} was not cut from main@${parent::7} (main moved after its dispatch, or was merged or rebased into it), so its changelog misses commits and nothing is published. Revert this commit, then re-dispatch release-plz.yml"
              exit 1
            fi
            release=true
          fi
          echo "release=$release" >>"$GITHUB_OUTPUT"
          echo "a merged release PR at ${SHA::7}: $release"

  release:
    name: publish and tag a merged release PR
    needs: [release-merge]
    if: needs.release-merge.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pixtuoid/.github/.github/actions/setup-rust@main
      - uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # release-plz releases "only when you merge the release PR"
  # (https://release-plz.dev/docs/config, `release_always`). `release-merge`
  # refusing a stale release PR, or missing a merged one, skips `release`, and
  # either leaves main at a version crates.io never got. Main at rest sits at a
  # released version, so every push checks that its version is tagged.
  version-tagged:
    name: the crate's version is tagged
    needs: [release-merge, release]
    if: ${{ !cancelled() && needs.release-merge.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pixtuoid/.github/.github/actions/setup-rust@main
      - name: The crate's version must be tagged
        run: |
          set -euo pipefail
          version=$(cargo metadata --format-version 1 --no-deps --locked | jq -r '.packages[0].version')
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is tagged"
          else
            echo "::error::main@${GITHUB_SHA::7} is at v$version, which no tag names, so crates.io never got it. release-plz tags only a merged release PR (release-plz.toml's release_always). If release-merge refused a stale one, revert its merge; if its release failed or was declined, re-run that run"
            exit 1
          fi

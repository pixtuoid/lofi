name: claude-review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
permissions: {}
jobs:
  claude-review:
    uses: pixtuoid/.github/.github/workflows/claude-review.yml@cdd206f54cb6b648016532696ac99a667568c627 # @main once pixtuoid/.github#3 merges
    permissions:
      contents: read
      pull-requests: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
